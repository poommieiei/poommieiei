name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *" # ปรับ format cron นิดหน่อยเพื่อให้มาตรฐาน (ที่นาทีที่ 0)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: poommieiei
          outputs: |
            dist/snake.svg?palette=github-light&color=auto&width=1000&height=500&animation=1&year=2025
            dist/snake-dark.svg?palette=github-dark&color=auto&width=1000&height=500&animation=1&year=2025
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
